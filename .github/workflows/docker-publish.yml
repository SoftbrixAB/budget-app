name: Docker publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve lowercase image name
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push PR preview image
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}

      - name: Build and push main images
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:sha-${{ github.sha }}

      - name: Smoke test the pushed image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker run -d --name budget-app -p 3000:3000 -e DATA_DIR=/tmp/data ${{ env.IMAGE }}:pr-${{ github.event.pull_request.number }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs budget-app
          exit 1

  deploy:
    name: Deploy to hosting server
    needs: build-push
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy configuration
        id: check
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DEPLOY_HOST not set - skipping SSH deploy (image is on GHCR as :latest)"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy over SSH
        if: ${{ steps.check.outputs.configured == 'true' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            cd ${{ secrets.DEPLOY_DIR || '/opt/budget-app' }}
            export BUDGET_IMAGE=${{ env.IMAGE }}:latest
            docker compose pull
            docker compose up -d
            docker image prune -f
