name: Docker publish

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  DH_IMAGE: softbrix/budget-app

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase GHCR image name
        run: echo "GHCR_IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr 'A-Z' 'a-z')" >> "$GITHUB_ENV"

      - name: Check Docker Hub configuration
        id: dh
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "DOCKERHUB_USERNAME not set - skipping Docker Hub push"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.dh.outputs.configured == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push PR preview image to GHCR
        if: ${{ github.event_name == 'pull_request' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ${{ env.GHCR_IMAGE }}:pr-${{ github.event.pull_request.number }}

      - name: Build and push main images to GHCR
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.GHCR_IMAGE }}:latest
            ${{ env.GHCR_IMAGE }}:sha-${{ github.sha }}

      - name: Build and push main images to Docker Hub
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.dh.outputs.configured == 'true' }}
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.DH_IMAGE }}:latest
            ${{ env.DH_IMAGE }}:sha-${{ github.sha }}

      - name: Smoke test the pushed PR image
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          docker run -d --name budget-app -p 3000:3000 -e DATA_DIR=/tmp/data ${{ env.GHCR_IMAGE }}:pr-${{ github.event.pull_request.number }}
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 1
          done
          docker logs budget-app
          exit 1
